<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Prototipo de onboarding con tareas, recursos, criterios de autonomía y red de apoyo."><title>Brújula · Mi autonomía</title><style>:root{--ink:#182c3b;--muted:#637583;--blue:#2359dd;--line:#e0e6ee;--bg:#f4f7fb;--green:#087668}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.55 'Segoe UI',Arial,sans-serif;background:var(--bg)}button,select,input,textarea{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:9px;padding:11px 17px;background:var(--blue);color:white;font-weight:600}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eaa92b;outline-offset:3px}a{color:inherit;text-decoration:none}aside{position:fixed;inset:0 auto 0 0;width:245px;background:white;border-right:1px solid var(--line);padding:32px 23px;display:flex;flex-direction:column}.brand{font-size:32px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:9px}.brandmark{display:inline-grid;place-items:center;background:var(--blue);border-radius:11px;color:white;width:38px;height:38px;font-size:30px}.branddot{color:var(--blue);margin-left:-10px}.workspace{font-size:12px;letter-spacing:1.3px;color:var(--muted);margin:45px 0 16px}nav a{display:flex;align-items:center;gap:13px;padding:13px 15px;margin:5px 0;border-radius:9px;font-weight:600;color:#526574}nav a.active{background:#eaf0ff;color:var(--blue)}nav a span{font-size:21px;width:22px}.sidebottom{margin-top:auto}.sidebottom p{font-size:14px;color:var(--muted)}.small{font-size:12px;letter-spacing:1.2px}.person{display:flex;align-items:center;gap:11px;margin:18px 0}.person small{display:block;color:var(--muted);font-size:14px}.avatar{border-radius:50%;background:#e3ecff;color:#345c98;display:inline-grid;place-items:center;width:39px;height:39px;font-size:13px;font-weight:700;flex-shrink:0}.pink{background:#f5dfde;color:#9c5353}.light{background:#eef3ff;color:var(--blue)}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.shell{margin-left:245px}header{min-height:85px;background:white;border-bottom:1px solid var(--line);padding:18px 38px;display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:12px}.headerRight{display:flex;align-items:center;gap:14px}select{padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-size:14px}.demo{font-size:12px;color:var(--muted);background:#f1f4f8;padding:5px 9px;border-radius:5px}main{max-width:1430px;margin:auto;padding:38px}h1{font-size:34px;letter-spacing:-1px;line-height:1.2;margin:8px 0 12px}h2{font-size:21px;letter-spacing:-.4px;margin:0 0 18px}h3{font-size:18px;margin:0 0 8px}p{margin:8px 0 18px}.muted,small{color:var(--muted)}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:1.6px}.titleline{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.badge{font-size:13px;padding:5px 10px;border-radius:6px;background:#eaf0ff;color:#345bb1;display:inline-block;white-space:nowrap}.badge.green{background:#def3eb;color:#086c57}.badge.amber{background:#fff0d5;color:#8b5b08}.grid{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(260px,1fr);gap:24px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:26px;margin-bottom:24px}.hero{background:#163d99;color:white;position:relative;overflow:hidden;border:0;padding:30px}.hero p{color:#dae5ff;max-width:540px}.hero .eyebrow{color:#b8d0ff}.hero h2{font-size:27px;margin:13px 0}.hero button{background:white;color:#204da8}.hero .badge{background:#3056a7;color:white}.herohead{display:flex;justify-content:space-between;align-items:center}.progress{height:7px;background:#e8edf4;border-radius:10px;overflow:hidden;margin:12px 0}.progress i{display:block;background:var(--blue);height:100%;border-radius:10px}.hero .progress{background:#4061a9}.hero .progress i{background:#8ee1cb}.between{display:flex;align-items:center;justify-content:space-between;gap:14px}.row{display:flex;gap:15px;align-items:center;padding:17px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0;padding-bottom:0}.row .grow{flex:1}.row b{display:block}.row small{font-size:14px}.stepIcon{width:39px;height:39px;border-radius:10px;background:#edf2fc;color:var(--blue);display:grid;place-items:center;flex-shrink:0}.textbutton{background:transparent;color:var(--blue);padding:5px 0;font-size:14px}.big{font-size:40px;font-weight:700;line-height:1.2}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:24px 0}.metric{padding:20px;border:1px solid var(--line);background:white;border-radius:13px}.metric small{display:block;margin-top:8px}.quote{background:#e9f2ef;border:0}.quote h3{color:#196854}.week{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.week button{text-align:left;background:white;color:var(--muted);border:1px solid var(--line);padding:18px}.week button.active{color:var(--blue);border-color:var(--blue);background:#edf2ff}.week b{display:block;margin:8px 0}.week small{font-size:13px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:25px 0}.flow div{font-size:14px;padding:12px;background:#edf2fb;border-radius:8px}.flow strong{display:block;color:var(--blue)}.check{display:flex;gap:12px;align-items:flex-start;padding:15px;border:1px solid var(--line);border-radius:9px;margin:9px 0;cursor:pointer}.check input{width:20px;height:20px;accent-color:var(--blue);margin-top:3px}.resource{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.resource .card{margin:0}.resource p{color:var(--muted);min-height:50px}.iconblock{width:45px;height:45px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;border-radius:10px;font-size:24px;margin-bottom:20px}input[type=search],textarea,input[type=text]{width:100%;border:1px solid #becbd8;border-radius:8px;padding:12px;color:var(--ink);background:white}textarea{resize:vertical;min-height:100px}label{display:block;margin:15px 0 6px}.search{max-width:450px;margin:20px 0}.note{background:#f0f5ff;padding:16px;border-left:3px solid var(--blue);border-radius:5px;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}button:disabled{opacity:.5;cursor:not-allowed}.timeline{border-left:2px solid #dae4f4;padding-left:22px}.timeline div{margin:20px 0}.timeline b{display:block}footer{max-width:1430px;margin:auto;padding:0 38px 24px;color:var(--muted);font-size:12px;display:flex;gap:20px;align-items:center}footer button{margin-left:auto;background:none;color:var(--muted);font-size:12px}dialog{width:min(620px,calc(100% - 32px));max-height:90vh;border:0;border-radius:16px;padding:30px;color:var(--ink);box-shadow:0 25px 100px #10233b55}dialog::backdrop{background:#12264377;backdrop-filter:blur(3px)}.close{float:right;background:#eff3f8;color:var(--ink);padding:5px 12px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#153d36;color:white;border-radius:10px;padding:15px 25px;display:none;z-index:10}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);font-size:14px}.tablewrap{overflow:auto}ul,ol{padding-left:23px}li{margin:10px 0}@media(min-width:1500px){main{padding-top:50px}}@media(max-width:1100px){aside{width:210px;padding:25px 16px}.shell{margin-left:210px}.grid{grid-template-columns:1fr}.demo{display:none}main{padding:26px}.week{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{position:static;width:100%;padding:16px;border-bottom:1px solid var(--line)}.brand{font-size:26px}.workspace,.sidebottom{display:none}nav{display:flex;overflow:auto;margin-top:12px}nav a{white-space:nowrap;font-size:14px;padding:8px 10px}nav a span{display:none}.shell{margin:0}header{padding:12px 18px}.headerRight .avatar{display:none}header>span{font-size:12px}main{padding:23px 17px}h1{font-size:29px}.titleline{align-items:flex-start}.titleline>.badge{display:none}.card{padding:21px}.metrics{gap:7px}.metric{padding:14px 10px}.big{font-size:29px}.resource{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.row{flex-wrap:wrap}.row .grow{min-width:140px}.week button{padding:12px}footer{padding:0 17px 20px}footer span{display:none}}
</style></head><body><aside><a class="brand" href="#inicio"><span class="brandmark">↗</span> brújula<span class="branddot">.</span></a><div class="workspace">MI ESPACIO DE APRENDIZAJE</div><nav id="nav"></nav><div class="sidebottom"><div class="small">TU ACOMPAÑANTE</div><div class="person"><span class="avatar pink">ML</span><div><b>Marina López</b><small>Personas y cultura</small></div></div><button class="light" data-action="help">Pedir orientación ↗</button><p>Preguntar también es avanzar.</p></div></aside><div class="shell"><header><span>Administración <span class="muted">/ Onboarding</span></span><div class="headerRight"><span class="demo">Prototipo · datos de ejemplo</span><label class="sr" for="role">Vista</label><select id="role"><option value="employee">Vista ingresante</option><option value="leader">Vista líder</option></select><span class="avatar">VC</span></div></header><main id="main"></main><footer>BRÚJULA · DEMO <span>Un paso a la vez. Con un rumbo claro.</span><button data-action="reset">Reiniciar demo</button></footer></div><dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" role="status"></div><script>const $=s=>document.querySelector(s);let checked=new Set(),submitted=false,requests=[],week=1,query='';const nav=[['inicio','⌂','Mi día'],['ruta','↗','Mi ruta'],['recursos','▤','Recursos'],['equipo','♧','Mi red de apoyo']];const resources=[['Guía','Preparar el reporte semanal','Un proceso de punta a punta, con criterios de aceptación.','8 min'],['Plantilla','Modelo de reporte aprobado','Estructura, fuentes y un ejemplo para comparar tu entrega.','5 min'],['Criterios','Cuándo decidir y cuándo consultar','Límites de autonomía y tratamiento de excepciones.','4 min'],['Glosario','El idioma del equipo','Términos y abreviaturas que vas a encontrar en el día a día.','3 min']];function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4000)}function title(k,t,d){return `<div class="titleline"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${d}</p></div><span class="badge">Día 8 de 30</span></div>`}function taskrow(t,d,action,done=false){return `<div class="row"><span class="stepIcon">${done?'✓':'↗'}</span><div class="grow"><b>${t}</b><small>${d}</small></div><button class="textbutton" data-action="${action}">${done?'Ver detalle':'Abrir tarea'} →</button></div>`}function render(){const page=location.hash.slice(1)||'inicio';$('#nav').innerHTML=nav.map(([id,icon,label])=>`<a href="#${id}" class="${page===id?'active':''}"><span>${icon}</span>${label}</a>`).join('');if($('#role').value==='leader'){leader();return}({inicio:home,ruta:route,recursos:library,equipo:team,tarea:task}[page]||home)()}
function home(){$('#main').innerHTML=title('TU PRÓXIMO PASO','Buen día, Valentina.','Esta semana: convertir lo que aprendiste en tu primera entrega.')+`<div class="grid"><section><div class="card hero"><div class="herohead"><span class="eyebrow">SEMANA 2 · PRACTICAR CON APOYO</span><span class="badge">${submitted?'En revisión':'En curso'}</span></div><h2>Tu primer reporte semanal</h2><p>Prepará una entrega completa con información del equipo. Tenés una guía, un ejemplo y criterios para revisar tu trabajo.</p><button data-action="task">${submitted?'Ver mi entrega':'Continuar mi tarea'} →</button><div style="margin-top:25px" class="between"><small style="color:#dce7ff">Tu ruta de aprendizaje</small><b>3 de 12 hitos</b></div><div class="progress"><i style="width:25%"></i></div></div><div class="card"><div class="between"><h2>Tu foco de hoy</h2><a class="textbutton" href="#ruta">Ver mi ruta →</a></div>${taskrow('Preparar el reporte semanal','Aplicación práctica · 40 min · Con revisión','task')}${taskrow('Revisar criterios de decisión','Lectura aplicada · 4 min','criteria')}${taskrow('Conocer el circuito del área','Comprender el proceso completo · Completado','context',true)}</div><div class="card quote"><h3>Podés avanzar sin tener todas las respuestas.</h3><p>Si una decisión supera tus límites, pedir ayuda a tiempo es parte de trabajar con autonomía.</p><button class="textbutton" data-action="help">Tengo una duda →</button></div></section><section><div class="card"><span class="eyebrow">TU OBJETIVO AL DÍA 30</span><h2 style="margin-top:12px">Resolver con criterio propio</h2><p class="muted">Preparar reportes habituales con calidad y reconocer cuándo escalar una excepción.</p><div class="between"><span>Nivel actual</span><span class="badge">Con apoyo</span></div><div class="flow" style="grid-template-columns:1fr"><div><strong>✓ Comprender</strong>Conocés el rol y sus prioridades.</div><div><strong>02 · Practicar</strong>Aplicás y revisás con un referente.</div><div><strong>03 · Resolver</strong>Demostrás autonomía en casos reales.</div></div><a class="textbutton" href="#ruta">Ver qué me falta dominar →</a></div><div class="card"><h2>No estás sola</h2><div class="person"><span class="avatar pink">ML</span><div><b>Marina López</b><small>Tu acompañante</small></div></div><p class="muted">Para orientarte, encontrar un contacto o conversar sobre tu integración.</p><button class="outline" data-action="help">Pedir orientación</button></div><div class="card"><span class="small muted">PRÓXIMO ENCUENTRO</span><h3 style="margin-top:10px">Revisamos tu primera entrega</h3><p class="muted">Viernes · 10:00 · 15 minutos<br>Con Tomás, referente de reportes.</p><button class="textbutton" data-action="meeting">Preparar el encuentro →</button></div></section></div>`}
const weeks=[['Ubicarme','Días 1–7','Comprender mi rol y el circuito del equipo',['Conocer el circuito del área','Acordar objetivos del puesto','Confirmar accesos y herramientas']],['Practicar','Días 8–14','Realizar una primera entrega con apoyo',['Preparar el reporte semanal','Revisar criterios de decisión','Conversar sobre mi primera entrega']],['Resolver','Días 15–21','Resolver situaciones con menos intervención',['Resolver un reporte con datos incompletos','Explicar una decisión','Registrar un aprendizaje']],['Demostrar','Días 22–30','Demostrar autonomía en situaciones habituales',['Completar un proceso real','Detectar y escalar una excepción','Revisar evidencias de autonomía']]];
function route(){$('#main').innerHTML=title('APRENDIZAJE CON UN RUMBO','Mi ruta hacia la autonomía','Avanzás cuando demostrás una capacidad. Cada persona puede necesitar tiempos distintos.')+`<div class="week">${weeks.map((w,i)=>`<button class="${week===i?'active':''}" data-week="${i}"><small>SEMANA ${i+1} · ${w[1]}</small><b>${w[0]}</b><span>${i===0?'✓ Completada':i===1?'En curso':'Próxima etapa'}</span></button>`).join('')}</div><div class="grid"><div class="card"><span class="eyebrow">SEMANA ${week+1}</span><h2 style="margin-top:12px">${weeks[week][2]}</h2>${weeks[week][3].map((t,i)=>taskrow(t,week===0?'Hito completado':week===1?'Hito de aprendizaje':'Actividad de la próxima etapa',week===1&&i===0?'task':week===1&&i===1?'criteria':'stage',week===0)).join('')}</div><div class="card"><h2>¿Cómo se reconoce tu autonomía?</h2><ol><li>Tu entrega cumple los criterios del puesto.</li><li>Podés explicar las decisiones que tomaste.</li><li>Detectás errores y los corregís.</li><li>Reconocés cuándo necesitás ayuda.</li></ol><div class="note">Completar una lectura o una lista no certifica autonomía. Tu referente revisa evidencias de trabajo.</div></div></div>`}
function task(){location.hash='tarea';$('#main').innerHTML=title('SEMANA 2 / DESAFÍO 01','Preparar el reporte semanal','Una tarea completa, desde las fuentes de información hasta la revisión de tu entrega.')+`<a href="#inicio" class="textbutton">← Volver a mi día</a><div class="flow"><div><strong>01 · Qué lograr</strong>Un resultado claro</div><div><strong>02 · Cómo hacerlo</strong>Guía y ejemplo</div><div><strong>03 · Cómo comprobarlo</strong>Criterios visibles</div><div><strong>04 · A quién recurrir</strong>Ayuda por tema</div></div><div class="grid"><section><div class="card"><h2>1. Qué tengo que lograr</h2><p>Preparar un reporte con los avances, pendientes y bloqueos de la semana para que el equipo pueda definir sus prioridades.</p><div class="note"><b>Está bien hecho cuando:</b> los datos son trazables, los pendientes tienen responsable y las decisiones necesarias quedan identificadas.</div><p class="muted" style="margin-top:16px">Tu aporte: ayudar al equipo a anticipar demoras y decidir qué atender primero.</p></div><div class="card"><h2>2. Cómo hacerlo</h2><ol><li>Reuní las novedades del tablero del equipo.</li><li>Contrastá los datos con las fuentes originales.</li><li>Completá la plantilla y señalá pendientes.</li><li>Revisá los criterios antes de pedir devolución.</li></ol><div class="actions"><button class="light" data-action="guide">Abrir guía</button><button class="outline" data-action="template">Ver ejemplo aprobado</button></div></div><div class="card"><div class="between"><h2>3. Comprobar mi trabajo</h2><span class="badge">${checked.size}/4</span></div>${['Verifiqué la fecha y la fuente de cada dato.','Cada pendiente tiene un responsable y un plazo.','Distinguí los hechos confirmados de la información faltante.','Señalé las decisiones que requieren revisión.'].map((t,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checked.has(i)?'checked':''} ${submitted?'disabled':''}><span>${t}</span></label>`).join('')}<div class="actions"><button data-action="submit" ${checked.size<4||submitted?'disabled':''}>${submitted?'✓ Entrega enviada a revisión':'Simular envío a revisión'}</button><button class="outline" data-action="help">Estoy bloqueada</button></div><p class="muted" style="font-size:14px;margin-top:12px">Demo: el envío simula una entrega. No adjunta archivos ni notifica a personas reales.</p>${submitted?'<div class="note">Tu autoverificación está completa. Falta la revisión de Tomás para confirmar el resultado; tu nivel de autonomía aún no cambia.</div>':''}</div></section><section><div class="card"><h2>4. A quién recurrir</h2><div class="person"><span class="avatar">TR</span><div><b>Tomás Ruiz</b><small>Referente de reportes</small></div></div><p class="muted">Criterios de calidad, fuentes de información y excepciones.</p><button data-action="help">Consultar a Tomás</button><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><h3>Tu margen para decidir</h3><p>Podés ordenar la información y corregir el formato.</p><p class="muted">Consultá antes de modificar una cifra de origen o compartir el reporte fuera del equipo.</p><button class="textbutton" data-action="criteria">Ver criterios de decisión →</button></div><div class="card"><span class="badge amber">Con revisión</span><p style="margin-top:14px">Esta entrega necesita devolución de tu referente. Más adelante podrás resolver casos habituales por tu cuenta.</p></div></section></div>`}
function library(){$('#main').innerHTML=title('CONOCIMIENTO A MANO','Lo que necesitás, cuando lo necesitás','Recursos breves vinculados al trabajo de tu puesto.')+`<div class="search"><label class="sr" for="search">Buscar recursos</label><input type="search" id="search" placeholder="Buscar una guía, plantilla o criterio…" value=""></div><div class="resource" id="results"></div>`;$('#search').value=query;results()}
function results(){const list=resources.map((r,i)=>({r,i})).filter(({r})=>r.join(' ').toLowerCase().includes(query.toLowerCase()));$('#results').innerHTML=list.length?list.map(({r,i})=>`<article class="card"><div class="between"><span class="iconblock">${['▤','▦','↗','Aa'][i]}</span><span class="badge">${r[0]}</span></div><h2>${r[1]}</h2><p>${r[2]}</p><small>Revisado por el área · ${r[3]}</small><div class="actions"><button class="light" data-resource="${i}">Consultar recurso →</button></div></article>`).join(''):'<div class="card"><h2>No encontramos ese recurso</h2><p>Probá con “reporte”, “criterios” o “glosario”. Si falta información, podés pedir ayuda.</p><button data-action="help">Pedir orientación</button></div>'}
function team(){$('#main').innerHTML=title('ACOMPAÑAMIENTO DISTRIBUIDO','Tu red de apoyo','Un contacto claro para cada necesidad. No tenés que resolver todo sola.')+`<div class="resource">${[['ML','Marina López','Tu acompañante','Integración, organización del aprendizaje y orientación.'],['TR','Tomás Ruiz','Referente de reportes','Fuentes, procedimientos y criterios de calidad.'],['LG','Lucía García','Tu líder','Objetivos, prioridades y límites de responsabilidad.'],['IT','Soporte interno','Herramientas y accesos','Permisos, cuentas y dificultades con los sistemas.']].map(([a,n,r,d])=>`<div class="card"><span class="avatar">${a}</span><h2 style="margin-top:15px">${n}</h2><span class="badge">${r}</span><p style="margin-top:15px">${d}</p><button class="outline" data-contact="${n}">Preparar consulta</button></div>`).join('')}</div><div class="card" style="margin-top:24px"><h2>Mis consultas de esta demo</h2><div id="requests"></div></div>`;const target=$('#requests');if(!requests.length)target.innerHTML='<p class="muted">Todavía no registraste consultas. Podés probar el circuito con cualquiera de tus referentes.</p>';requests.forEach(r=>{const p=document.createElement('p');p.textContent=`${r.topic} · ${r.person} · Pendiente de respuesta (simulada)`;target.appendChild(p)})}
function leader(){$('#main').innerHTML=title('SEGUIMIENTO DEL EQUIPO','Acompañar donde hace falta','Vista de ejemplo: avances y bloqueos, con revisión en momentos clave.')+`<div class="metrics"><div class="metric"><span class="big">1</span><small>Ingresante en esta demo</small></div><div class="metric"><span class="big">${submitted?1:0}</span><small>Entrega para revisar</small></div><div class="metric"><span class="big">${requests.length}</span><small>Consulta pendiente</small></div></div><div class="card"><h2>Ruta de Valentina Costa</h2><div class="tablewrap"><table><thead><tr><th>Etapa</th><th>Evidencia</th><th>Responsable</th><th>Estado</th></tr></thead><tbody><tr><td>Comprender el rol</td><td>Objetivos y circuito revisados</td><td>Lucía</td><td><span class="badge green">Completada</span></td></tr><tr><td>Practicar con apoyo</td><td>Primer reporte semanal</td><td>Tomás</td><td><span class="badge">${submitted?'Pendiente de revisión':'En curso'}</span></td></tr><tr><td>Resolver con autonomía</td><td>Caso real y justificación</td><td>Lucía</td><td>Próxima etapa</td></tr></tbody></table></div></div><div class="grid"><div class="card"><h2>Próxima intervención</h2><p>${submitted?'Tomás debe revisar la calidad del reporte y dejar una devolución concreta.':'Esperar la primera entrega y revisar si cumple los criterios acordados.'}</p><div class="note">El progreso se valida con evidencia. La autoverificación del ingresante no habilita por sí sola un nuevo nivel.</div></div><div class="card"><h2>Carga de acompañamiento</h2><p>Registrar tiempo de líderes y referentes permite comprobar si el proceso reduce el esfuerzo total.</p><small>En este prototipo no se registran horas reales.</small></div></div>`}
function modal(html){$('#dialogContent').innerHTML='<button class="close" aria-label="Cerrar" data-action="close">×</button>'+html;$('#dialog').showModal()}
function resource(i){const contents=[`<h2>Preparar el reporte semanal</h2><p class="muted">Guía del área · Responsable: Tomás Ruiz · Ejemplo</p><ol><li><b>Ubicá las fuentes:</b> tablero de tareas y registro de novedades.</li><li><b>Validá el período:</b> todos los datos deben corresponder a la misma semana.</li><li><b>Armá la entrega:</b> avances, pendientes, bloqueos y decisiones.</li><li><b>Revisá:</b> cada cifra tiene fuente y cada pendiente tiene responsable.</li></ol><div class="note">Si dos fuentes se contradicen, registrá la diferencia y consultá. No elijas una cifra sin verificar.</div>`,`<h2>Ejemplo de reporte aprobado</h2><p class="muted">Datos ficticios para practicar.</p><div class="tablewrap"><table><tr><th>Ítem</th><th>Estado</th><th>Próximo paso</th></tr><tr><td>Actualizar registro de pedidos</td><td>Completado</td><td>Fuente: tablero del área</td></tr><tr><td>Confirmar 3 fechas de entrega</td><td>Pendiente</td><td>Tomás · viernes</td></tr><tr><td>Dos fechas contradictorias</td><td>Requiere revisión</td><td>Consultar al responsable</td></tr></table></div><p>La entrega identifica qué se sabe, qué falta y quién debe actuar.</p>`,`<h2>Cuándo decidir y cuándo consultar</h2><h3>Podés resolver</h3><p>Formato, organización y correcciones de redacción que no cambien el contenido.</p><h3>Consultá con tu referente</h3><p>Datos contradictorios, fuentes faltantes o excepciones al procedimiento.</p><h3>Requiere autorización del líder</h3><p>Cambios de prioridades, compromisos con otras áreas o difusión fuera del equipo.</p><div class="note">Estos límites pertenecen al caso ficticio de la demo. Deben acordarse para cada puesto.</div>`,`<h2>El idioma del equipo</h2><p><b>Hito:</b> una capacidad que podés demostrar con tu trabajo.</p><p><b>Criterio de aceptación:</b> condición que debe cumplir una entrega.</p><p><b>Escalar:</b> pedir intervención a quien tiene autoridad o conocimiento para resolver.</p><p><b>Fuente:</b> registro del que proviene un dato.</p>`];modal(contents[i])}
function help(person='Tomás Ruiz'){modal(`<span class="eyebrow">PEDIR AYUDA ES PARTE DEL PROCESO</span><h2 style="margin-top:12px">Preparemos tu consulta</h2><p class="muted">Simulá cómo pedirías ayuda. No se envían mensajes reales.</p><form id="helpForm"><label for="contact">¿A quién?</label><select id="contact">${['Tomás Ruiz','Marina López','Lucía García','Soporte interno'].map(n=>`<option ${person===n?'selected':''}>${n}</option>`).join('')}</select><label for="topic">¿En qué necesitás ayuda?</label><input id="topic" type="text" required maxlength="120" placeholder="Ej.: encontré dos cifras distintas"><label for="detail">¿Qué pasó y qué intentaste?</label><textarea id="detail" required placeholder="Contá el contexto para que puedan orientarte."></textarea><button style="margin-top:20px" type="submit">Registrar consulta simulada</button></form>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-week],[data-resource],[data-contact]');if(!b)return;if(b.dataset.week!==undefined){week=+b.dataset.week;route();return}if(b.dataset.resource!==undefined){resource(+b.dataset.resource);return}if(b.dataset.contact){help(b.dataset.contact);return}const a=b.dataset.action;({task:()=>{if($('#dialog').open)$('#dialog').close();location.hash='tarea';task()},help:()=>help(),close:()=>$('#dialog').close(),guide:()=>resource(0),template:()=>resource(1),criteria:()=>resource(2),submit:()=>{submitted=true;task();toast('Entrega simulada registrada. Pendiente de revisión.')},context:()=>modal('<h2>El circuito del área</h2><div class="timeline"><div><b>1. El equipo registra novedades</b>Insumos para el reporte.</div><div><b>2. Administración consolida</b>Tu rol: verificar y ordenar la información.</div><div><b>3. El referente revisa</b>Contrasta fuentes y excepciones.</div><div><b>4. El líder define prioridades</b>Tu entrega permite anticipar bloqueos.</div></div>'),stage:()=>modal(`<h2>${weeks[week][2]}</h2><p>Esta etapa se adapta según las evidencias de aprendizaje.</p><p>El referente acuerda el caso de trabajo, los criterios y el apoyo necesario antes de comenzar.</p><button data-action="task">Explorar la tarea de ejemplo</button>`),meeting:()=>modal('<h2>Prepará tu encuentro</h2><p>Viernes · 10:00 · 15 minutos · Tomás Ruiz</p><ol><li>Traé tu reporte y una decisión que quieras revisar.</li><li>Identificá qué pudiste resolver y dónde te trabaste.</li><li>Acordá un próximo paso concreto.</li></ol><p class="muted">Encuentro ficticio; no se crea un evento en el calendario.</p>'),reset:()=>{checked.clear();submitted=false;requests=[];week=1;query='';$('#role').value='employee';location.hash='inicio';render();toast('Demo reiniciada')}}[a]||(()=>{}))()});document.addEventListener('change',e=>{if(e.target.dataset.check!==undefined){const i=+e.target.dataset.check;e.target.checked?checked.add(i):checked.delete(i);const y=scrollY;task();scrollTo(0,y)}if(e.target.id==='role')render()});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;results()}});document.addEventListener('submit',e=>{if(e.target.id==='helpForm'){e.preventDefault();requests.push({topic:$('#topic').value,person:$('#contact').value});$('#dialog').close();toast('Consulta registrada en la demo. No se envió un mensaje.');render()}});window.addEventListener('hashchange',render);render();

</script></body></html>
